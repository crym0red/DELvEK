name: DELvEK Unsigned iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      # Keep the repository's pinned gitlink revisions. Do not clone a
      # different LiteHook/OpenSSL revision over the checked-out submodules.
      - name: Initialize native submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

          echo "Submodule status:"
          git submodule status --recursive

      - name: Verify native dependencies
        shell: bash
        run: |
          set -euo pipefail

          LITEHOOK_DIR="$GITHUB_WORKSPACE/litehook"
          LITEHOOK_SOURCE="$LITEHOOK_DIR/src/litehook.c"
          LITEHOOK_HEADER="$LITEHOOK_DIR/src/litehook.h"
          OPENSSL_FRAMEWORK="$GITHUB_WORKSPACE/OpenSSL/Frameworks/OpenSSL.xcframework"

          if [ ! -f "$LITEHOOK_SOURCE" ]; then
            echo "::error::Missing LiteHook source: $LITEHOOK_SOURCE"
            find "$LITEHOOK_DIR" -maxdepth 4 -print 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$LITEHOOK_HEADER" ]; then
            echo "::error::Missing LiteHook header: $LITEHOOK_HEADER"
            exit 1
          fi

          if [ ! -f "$OPENSSL_FRAMEWORK/Info.plist" ]; then
            echo "::error::Missing OpenSSL.xcframework: $OPENSSL_FRAMEWORK"
            echo "The OpenSSL submodule must contain the prebuilt XCFramework."
            find "$GITHUB_WORKSPACE/OpenSSL" -maxdepth 4 -print 2>/dev/null | head -300 || true
            exit 1
          fi

          echo "LiteHook revision:"
          git -C "$LITEHOOK_DIR" rev-parse HEAD

          echo "OpenSSL revision:"
          git -C "$GITHUB_WORKSPACE/OpenSSL" rev-parse HEAD

          echo "LiteHook: OK"
          echo "OpenSSL XCFramework: OK"

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"

      - name: Show Xcode information
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo
          xcodebuild -showsdks

      - name: Prepare clean build directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          mkdir -p "$GITHUB_WORKSPACE/build"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/LiveContainer.xcodeproj" \
            -scheme "LiveContainer"

      - name: Inspect build settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$GITHUB_WORKSPACE/LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings > build/build-settings.txt

          grep -E 'PRODUCT_NAME|FULL_PRODUCT_NAME|TARGET_BUILD_DIR|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER' \
            build/build-settings.txt || true

      - name: Build unsigned DELvEK
        shell: bash
        run: |
          set -o pipefail

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"
          LOG="$GITHUB_WORKSPACE/build/xcodebuild.log"

          rm -rf "$DERIVED_DATA"

          xcodebuild build \
            -project "$GITHUB_WORKSPACE/LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG"

      - name: Upload Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/xcodebuild.log
            build/build-settings.txt
          if-no-files-found: warn

      - name: Locate DELvEK.app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          APP="$(find "$PRODUCTS" -type d -name 'DELvEK.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::DELvEK.app was not produced."
            echo
            echo "Available .app products:"
            find "$PRODUCTS" -type d -name '*.app' -print || true
            exit 1
          fi

          printf '%s\n' "$APP" > build/app-path.txt
          echo "DELvEK.app: $APP"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/app-path.txt)"
          PAYLOAD="$GITHUB_WORKSPACE/build/Payload"
          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"

          rm -rf "$PAYLOAD"
          rm -f "$IPA"
          mkdir -p "$PAYLOAD"

          ditto "$APP" "$PAYLOAD/DELvEK.app"

          cd "$GITHUB_WORKSPACE/build"
          /usr/bin/zip -qry "$IPA" Payload

          rm -rf "$PAYLOAD"

          echo "Created unsigned IPA:"
          ls -lh "$IPA"

      - name: Verify unsigned artifact
        shell: bash
        run: |
          set -euo pipefail

          VERIFY="$GITHUB_WORKSPACE/build/verify"
          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"
          APP="$VERIFY/Payload/DELvEK.app"

          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          /usr/bin/unzip -q "$IPA" -d "$VERIFY"

          if [ ! -d "$APP" ]; then
            echo "::error::Packaged DELvEK.app was not found."
            exit 1
          fi

          echo "========================================"
          echo "Bundle information"
          echo "========================================"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

          echo
          echo "========================================"
          echo "Signature directories"
          echo "========================================"

          if find "$APP" -type d -name '_CodeSignature' -print -quit | grep -q .; then
            echo "::error::A _CodeSignature directory exists in the unsigned artifact."
            find "$APP" -type d -name '_CodeSignature' -print
            exit 1
          fi

          echo "No _CodeSignature directories found."

          echo
          echo "codesign inspection:"
          codesign -dvv "$APP" 2>&1 || true

          echo
          echo "IPA contents:"
          /usr/bin/unzip -l "$IPA" | head -80

      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 build/DELvEK-unsigned.ipa | tee build/DELvEK-unsigned.ipa.sha256

      - name: Upload unsigned DELvEK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELvEK-unsigned
          path: |
            build/DELvEK-unsigned.ipa
            build/DELvEK-unsigned.ipa.sha256
          if-no-files-found: error

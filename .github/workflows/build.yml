name: DELvEK Unsigned iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare litehook source
        shell: bash
        run: |
          set -euo pipefail

          LITEHOOK_DIR="$GITHUB_WORKSPACE/litehook"
          LITEHOOK_SOURCE="$LITEHOOK_DIR/src/litehook.c"
          LITEHOOK_COMMIT="a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9"

          if [ ! -f "$LITEHOOK_SOURCE" ]; then
            echo "litehook/src/litehook.c is missing; restoring litehook commit $LITEHOOK_COMMIT."
            rm -rf "$LITEHOOK_DIR"
            git clone --no-checkout https://github.com/LiveContainer/litehook.git "$LITEHOOK_DIR"
            git -C "$LITEHOOK_DIR" checkout --detach "$LITEHOOK_COMMIT"
          fi

          if [ ! -f "$LITEHOOK_SOURCE" ]; then
            echo "::error::litehook/src/litehook.c is still missing."
            find "$LITEHOOK_DIR" -maxdepth 3 -print | head -200
            exit 1
          fi

          echo "litehook source verified: $LITEHOOK_SOURCE"
          git -C "$LITEHOOK_DIR" rev-parse HEAD

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          xcodebuild -resolvePackageDependencies \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer"

      - name: Build unsigned DELvEK
        shell: bash
        run: |
          set -o pipefail

          rm -rf build/DerivedData
          mkdir -p build

          xcodebuild build \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/DELvEK.app"

          if [ ! -d "$APP" ]; then
            echo "DELvEK.app was not produced. Available products:"
            find "$PWD/build/DerivedData/Build/Products" \
              -maxdepth 2 \
              -type d \
              -name '*.app' \
              -print || true
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/DELvEK.app

          rm -f build/DELvEK-unsigned.ipa

          cd build
          zip -qry DELvEK-unsigned.ipa Payload

          rm -rf Payload

      - name: Verify artifact is unsigned
        run: |
          set -euo pipefail

          unzip -q build/DELvEK-unsigned.ipa -d build/verify

          APP="build/verify/Payload/DELvEK.app"

          echo "Bundle:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

          echo "Display name:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$APP/Info.plist" || true

          echo "Code signature directories:"
          find "$APP" \
            -type d \
            -name '_CodeSignature' \
            -print

          echo "Code signatures:"
          codesign -dvv "$APP" 2>&1 || true

      - name: Upload unsigned DELvEK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELvEK-unsigned
          path: build/DELvEK-unsigned.ipa
          if-no-files-found: error

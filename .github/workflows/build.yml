name: DELvEK Unsigned iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT: LiveContainer.xcodeproj
  SCHEME: LiveContainer
  CONFIGURATION: Release
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

jobs:
  build-unsigned:
    name: Build unsigned DELvEK
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      # ---------------------------------------------------------
      # Native dependencies
      # ---------------------------------------------------------
      - name: Initialize native dependencies
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

          echo "Initial submodule status:"
          git submodule status --recursive || true

          # -----------------------------------------------------
          # LiteHook
          # -----------------------------------------------------
          LITEHOOK_DIR="$GITHUB_WORKSPACE/litehook"
          LITEHOOK_SOURCE="$LITEHOOK_DIR/src/litehook.c"
          LITEHOOK_HEADER="$LITEHOOK_DIR/src/litehook.h"

          LITEHOOK_REPO="https://github.com/LiveContainer/litehook.git"
          LITEHOOK_COMMIT="a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9"

          if [ ! -f "$LITEHOOK_SOURCE" ] || \
             [ ! -f "$LITEHOOK_HEADER" ]; then

            echo "LiteHook checkout is incomplete."
            echo "Restoring pinned LiteHook revision:"
            echo "$LITEHOOK_COMMIT"

            rm -rf "$LITEHOOK_DIR"

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$LITEHOOK_REPO" \
              "$LITEHOOK_DIR"

            git -C "$LITEHOOK_DIR" checkout --detach "$LITEHOOK_COMMIT"
          fi

          # -----------------------------------------------------
          # OpenSSL
          # -----------------------------------------------------
          OPENSSL_DIR="$GITHUB_WORKSPACE/OpenSSL"
          OPENSSL_FRAMEWORK="$OPENSSL_DIR/Frameworks/OpenSSL.xcframework"

          OPENSSL_REPO="https://github.com/krzyzanowskim/OpenSSL.git"
          OPENSSL_COMMIT="623c84da314e85363236507ca38a4bde65df21c3"

          if [ ! -f "$OPENSSL_FRAMEWORK/Info.plist" ]; then

            echo "OpenSSL XCFramework is missing."
            echo "Restoring pinned OpenSSL revision:"
            echo "$OPENSSL_COMMIT"

            rm -rf "$OPENSSL_DIR"

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$OPENSSL_REPO" \
              "$OPENSSL_DIR"

            git -C "$OPENSSL_DIR" checkout --detach "$OPENSSL_COMMIT"
          fi

          echo
          echo "Final native dependency status:"
          echo

          echo "LiteHook:"
          git -C "$LITEHOOK_DIR" rev-parse HEAD

          echo
          echo "OpenSSL:"
          git -C "$OPENSSL_DIR" rev-parse HEAD

      - name: Verify native dependencies
        shell: bash
        run: |
          set -euo pipefail

          LITEHOOK_DIR="$GITHUB_WORKSPACE/litehook"
          LITEHOOK_SOURCE="$LITEHOOK_DIR/src/litehook.c"
          LITEHOOK_HEADER="$LITEHOOK_DIR/src/litehook.h"

          OPENSSL_DIR="$GITHUB_WORKSPACE/OpenSSL"
          OPENSSL_FRAMEWORK="$OPENSSL_DIR/Frameworks/OpenSSL.xcframework"

          echo "========================================"
          echo "Checking LiteHook"
          echo "========================================"

          if [ ! -f "$LITEHOOK_SOURCE" ]; then
            echo "::error::Missing LiteHook source:"
            echo "$LITEHOOK_SOURCE"
            find "$LITEHOOK_DIR" -maxdepth 5 -print || true
            exit 1
          fi

          if [ ! -f "$LITEHOOK_HEADER" ]; then
            echo "::error::Missing LiteHook header:"
            echo "$LITEHOOK_HEADER"
            exit 1
          fi

          echo "LiteHook revision:"
          git -C "$LITEHOOK_DIR" rev-parse HEAD

          echo
          echo "========================================"
          echo "Checking OpenSSL"
          echo "========================================"

          if [ ! -f "$OPENSSL_FRAMEWORK/Info.plist" ]; then
            echo "::error::Missing OpenSSL XCFramework:"
            echo "$OPENSSL_FRAMEWORK"

            find "$OPENSSL_DIR" \
              -maxdepth 5 \
              -print \
              2>/dev/null \
              | head -300 || true

            exit 1
          fi

          echo "OpenSSL revision:"
          git -C "$OPENSSL_DIR" rev-parse HEAD

          echo
          echo "Native dependencies verified."

      # ---------------------------------------------------------
      # Xcode 26.2
      # ---------------------------------------------------------
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2.0"

      - name: Show Xcode information
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          xcodebuild -showsdks

      # ---------------------------------------------------------
      # Clean build state
      # ---------------------------------------------------------
      - name: Prepare clean build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build/StikJIT"

      # ---------------------------------------------------------
      # StikJIT
      # ---------------------------------------------------------
      - name: Build or fetch StikJIT XCFramework
        shell: bash
        env:
          STIKJIT_URL: ${{ vars.STIKJIT_URL }}
          STIKJIT_SHA256: ${{ vars.STIKJIT_SHA256 }}
        run: |
          set -euo pipefail

          STIKJIT_DIR="$GITHUB_WORKSPACE/build/StikJIT"
          STIKJIT_FRAMEWORK="$STIKJIT_DIR/StikJIT.xcframework"
          SCRIPT="$GITHUB_WORKSPACE/Scripts/build_stikjit.sh"

          rm -rf "$STIKJIT_DIR"
          mkdir -p "$STIKJIT_DIR"

          echo "========================================"
          echo "Attempting local StikJIT build"
          echo "========================================"

          if [ -f "$SCRIPT" ]; then
            chmod +x "$SCRIPT"

            if bash "$SCRIPT"; then
              echo "StikJIT build script completed."
            else
              echo "::warning::Local StikJIT build failed."
            fi
          else
            echo "::warning::Scripts/build_stikjit.sh not found."
          fi

          # -----------------------------------------------------
          # Find framework produced by the script
          # -----------------------------------------------------
          FOUND="$(
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name 'StikJIT.xcframework' \
              -not -path "$STIKJIT_DIR/*" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -n "$FOUND" ]; then
            echo "Found generated StikJIT:"
            echo "$FOUND"

            rm -rf "$STIKJIT_FRAMEWORK"
            ditto "$FOUND" "$STIKJIT_FRAMEWORK"
          fi

          # -----------------------------------------------------
          # Verified fallback download
          #
          # Configure these repository variables:
          #
          # STIKJIT_URL
          # STIKJIT_SHA256
          #
          # The checksum must be the SHA-256 of the downloaded
          # StikJIT ZIP.
          # -----------------------------------------------------
          if [ ! -f "$STIKJIT_FRAMEWORK/Info.plist" ]; then

            echo
            echo "========================================"
            echo "Local build did not produce StikJIT"
            echo "Attempting pinned artifact fallback"
            echo "========================================"

            if [ -z "${STIKJIT_URL:-}" ]; then
              echo "::error::STIKJIT_URL is not configured."
              echo "Add a pinned StikJIT XCFramework ZIP URL as:"
              echo "Repository Settings > Secrets and variables > Actions > Variables"
              echo
              echo "Required variable:"
              echo "STIKJIT_URL"
              exit 1
            fi

            if [ -z "${STIKJIT_SHA256:-}" ]; then
              echo "::error::STIKJIT_SHA256 is not configured."
              echo "A SHA-256 checksum is required for the fallback artifact."
              exit 1
            fi

            ARCHIVE="$GITHUB_WORKSPACE/build/StikJIT.zip"
            EXTRACTED="$GITHUB_WORKSPACE/build/StikJITExtracted"

            rm -f "$ARCHIVE"
            rm -rf "$EXTRACTED"

            echo "Downloading pinned StikJIT artifact..."

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --silent \
              --show-error \
              "$STIKJIT_URL" \
              --output "$ARCHIVE"

            echo
            echo "Verifying SHA-256..."

            echo "$STIKJIT_SHA256  $ARCHIVE" \
              | shasum -a 256 -c -

            mkdir -p "$EXTRACTED"

            /usr/bin/unzip \
              -q \
              "$ARCHIVE" \
              -d "$EXTRACTED"

            DOWNLOADED="$(
              find "$EXTRACTED" \
                -type d \
                -name 'StikJIT.xcframework' \
                -print \
                -quit
            )"

            if [ -z "$DOWNLOADED" ]; then
              echo "::error::Downloaded artifact does not contain StikJIT.xcframework."

              find "$EXTRACTED" \
                -maxdepth 6 \
                -print \
                || true

              exit 1
            fi

            rm -rf "$STIKJIT_FRAMEWORK"
            ditto "$DOWNLOADED" "$STIKJIT_FRAMEWORK"
          fi

          # -----------------------------------------------------
          # Final verification
          # -----------------------------------------------------
          echo
          echo "========================================"
          echo "Verifying StikJIT"
          echo "========================================"

          if [ ! -d "$STIKJIT_FRAMEWORK" ]; then
            echo "::error::StikJIT.xcframework was not produced or fetched."
            exit 1
          fi

          if [ ! -f "$STIKJIT_FRAMEWORK/Info.plist" ]; then
            echo "::error::StikJIT.xcframework is missing Info.plist."

            find "$STIKJIT_FRAMEWORK" \
              -maxdepth 5 \
              -print \
              || true

            exit 1
          fi

          echo "StikJIT XCFramework:"
          echo "$STIKJIT_FRAMEWORK"

          echo
          echo "StikJIT contents:"
          find "$STIKJIT_FRAMEWORK" \
            -maxdepth 3 \
            -print

          echo
          echo "StikJIT Info.plist:"
          /usr/libexec/PlistBuddy \
            -c 'Print :' \
            "$STIKJIT_FRAMEWORK/Info.plist"

          echo
          echo "StikJIT XCFramework verified successfully."

      # ---------------------------------------------------------
      # Swift packages
      # ---------------------------------------------------------
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME"

      # ---------------------------------------------------------
      # Build settings
      # ---------------------------------------------------------
      - name: Inspect build settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -showBuildSettings \
            > "$GITHUB_WORKSPACE/build/build-settings.txt"

          grep -E \
            'PRODUCT_NAME|FULL_PRODUCT_NAME|TARGET_BUILD_DIR|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN' \
            "$GITHUB_WORKSPACE/build/build-settings.txt" \
            || true

      # ---------------------------------------------------------
      # Final StikJIT check immediately before Xcode
      # ---------------------------------------------------------
      - name: Verify StikJIT before Xcode build
        shell: bash
        run: |
          set -euo pipefail

          STIKJIT="$GITHUB_WORKSPACE/build/StikJIT/StikJIT.xcframework"

          if [ ! -f "$STIKJIT/Info.plist" ]; then
            echo "::error::StikJIT is missing immediately before Xcode build."
            echo "Expected:"
            echo "$STIKJIT"
            exit 1
          fi

          echo "StikJIT is ready for Xcode:"
          echo "$STIKJIT"

      # ---------------------------------------------------------
      # Build unsigned DELvEK
      # ---------------------------------------------------------
      - name: Build unsigned DELvEK
        shell: bash
        run: |
          set -o pipefail

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"
          LOG="$GITHUB_WORKSPACE/build/xcodebuild.log"

          rm -rf "$DERIVED_DATA"
          mkdir -p "$DERIVED_DATA"

          xcodebuild build \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG"

      # ---------------------------------------------------------
      # Diagnostics
      # ---------------------------------------------------------
      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostics
          path: |
            build/xcodebuild.log
            build/build-settings.txt
          if-no-files-found: warn

      # ---------------------------------------------------------
      # Locate application
      # ---------------------------------------------------------
      - name: Locate DELvEK.app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"

          if [ ! -d "$PRODUCTS" ]; then
            echo "::error::Build Products directory does not exist:"
            echo "$PRODUCTS"
            exit 1
          fi

          APP="$(
            find "$PRODUCTS" \
              -type d \
              -name 'DELvEK.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::DELvEK.app was not produced."

            echo
            echo "Available .app products:"

            find "$PRODUCTS" \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          printf '%s\n' "$APP" \
            > "$GITHUB_WORKSPACE/build/app-path.txt"

          echo "DELvEK.app:"
          echo "$APP"

      # ---------------------------------------------------------
      # Package IPA
      # ---------------------------------------------------------
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat "$GITHUB_WORKSPACE/build/app-path.txt")"

          PAYLOAD="$GITHUB_WORKSPACE/build/Payload"
          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"

          rm -rf "$PAYLOAD"
          rm -rf "$GITHUB_WORKSPACE/build/verify"
          rm -f "$IPA"

          mkdir -p "$PAYLOAD"

          ditto \
            "$APP" \
            "$PAYLOAD/DELvEK.app"

          cd "$GITHUB_WORKSPACE/build"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          rm -rf "$PAYLOAD"

          echo "Created unsigned IPA:"
          ls -lh "$IPA"

      # ---------------------------------------------------------
      # Verify unsigned artifact
      # ---------------------------------------------------------
      - name: Verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"
          VERIFY="$GITHUB_WORKSPACE/build/verify"
          APP="$VERIFY/Payload/DELvEK.app"

          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          /usr/bin/unzip \
            -q \
            "$IPA" \
            -d "$VERIFY"

          if [ ! -d "$APP" ]; then
            echo "::error::Packaged DELvEK.app was not found."
            exit 1
          fi

          echo "========================================"
          echo "Bundle information"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$APP/Info.plist" \
            || true

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP/Info.plist" \
            || true

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP/Info.plist" \
            || true

          echo
          echo "========================================"
          echo "Signature verification"
          echo "========================================"

          SIGNATURE_DIRS="$(
            find "$APP" \
              -type d \
              -name '_CodeSignature' \
              -print
          )"

          if [ -n "$SIGNATURE_DIRS" ]; then
            echo "::error::Found _CodeSignature directories:"
            echo "$SIGNATURE_DIRS"
            exit 1
          fi

          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::Unsigned artifact contains embedded.mobileprovision."
            exit 1
          fi

          echo "No _CodeSignature directories found."
          echo "No embedded.mobileprovision found."

          echo
          echo "codesign inspection:"
          codesign -dvv "$APP" 2>&1 || true

          echo
          echo "========================================"
          echo "IPA contents"
          echo "========================================"

          /usr/bin/unzip \
            -l \
            "$IPA" \
            | head -100

      # ---------------------------------------------------------
      # Checksum
      # ---------------------------------------------------------
      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail

          shasum \
            -a 256 \
            "$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa" \
            | tee "$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa.sha256"

      # ---------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------
      - name: Upload unsigned DELvEK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELvEK-unsigned
          path: |
            build/DELvEK-unsigned.ipa
            build/DELvEK-unsigned.ipa.sha256
          if-no-files-found: error

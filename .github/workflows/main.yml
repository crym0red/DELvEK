name: DELvEK Unsigned iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT: LiveContainer.xcodeproj
  SCHEME: LiveContainer
  CONFIGURATION: Release
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

jobs:
  build-unsigned:
    name: Build unsigned DELvEK
    runs-on: macos-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      # =========================================================
      # NATIVE DEPENDENCIES
      # =========================================================
      - name: Initialize native dependencies
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

          echo "========================================"
          echo "Submodule status"
          echo "========================================"

          git submodule status --recursive || true

          # -----------------------------------------------------
          # LiteHook
          # -----------------------------------------------------
          LITEHOOK_DIR="$GITHUB_WORKSPACE/litehook"
          LITEHOOK_SOURCE="$LITEHOOK_DIR/src/litehook.c"
          LITEHOOK_HEADER="$LITEHOOK_DIR/src/litehook.h"

          LITEHOOK_REPO="https://github.com/LiveContainer/litehook.git"
          LITEHOOK_COMMIT="a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9"

          if [ ! -f "$LITEHOOK_SOURCE" ] || \
             [ ! -f "$LITEHOOK_HEADER" ]; then

            echo "Restoring pinned LiteHook."

            rm -rf "$LITEHOOK_DIR"

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$LITEHOOK_REPO" \
              "$LITEHOOK_DIR"

            git -C "$LITEHOOK_DIR" checkout --detach "$LITEHOOK_COMMIT"
          fi

          # -----------------------------------------------------
          # OpenSSL
          # -----------------------------------------------------
          OPENSSL_DIR="$GITHUB_WORKSPACE/OpenSSL"
          OPENSSL_FRAMEWORK="$OPENSSL_DIR/Frameworks/OpenSSL.xcframework"

          OPENSSL_REPO="https://github.com/krzyzanowskim/OpenSSL.git"
          OPENSSL_COMMIT="623c84da314e85363236507ca38a4bde65df21c3"

          if [ ! -f "$OPENSSL_FRAMEWORK/Info.plist" ]; then

            echo "Restoring pinned OpenSSL."

            rm -rf "$OPENSSL_DIR"

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$OPENSSL_REPO" \
              "$OPENSSL_DIR"

            git -C "$OPENSSL_DIR" checkout --detach "$OPENSSL_COMMIT"
          fi

      # =========================================================
      # VERIFY NATIVE DEPENDENCIES
      # =========================================================
      - name: Verify native dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking LiteHook"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/litehook/src/litehook.c" ]; then
            echo "::error::Missing LiteHook source:"
            echo "$GITHUB_WORKSPACE/litehook/src/litehook.c"

            find "$GITHUB_WORKSPACE/litehook" \
              -maxdepth 5 \
              -print \
              2>/dev/null || true

            exit 1
          fi

          if [ ! -f "$GITHUB_WORKSPACE/litehook/src/litehook.h" ]; then
            echo "::error::Missing LiteHook header:"
            echo "$GITHUB_WORKSPACE/litehook/src/litehook.h"
            exit 1
          fi

          echo "LiteHook source:"
          echo "$GITHUB_WORKSPACE/litehook/src/litehook.c"

          echo "LiteHook header:"
          echo "$GITHUB_WORKSPACE/litehook/src/litehook.h"

          echo "LiteHook revision:"
          git -C "$GITHUB_WORKSPACE/litehook" rev-parse HEAD

          echo
          echo "========================================"
          echo "Checking OpenSSL"
          echo "========================================"

          OPENSSL_FRAMEWORK="$GITHUB_WORKSPACE/OpenSSL/Frameworks/OpenSSL.xcframework"

          if [ ! -f "$OPENSSL_FRAMEWORK/Info.plist" ]; then
            echo "::error::Missing OpenSSL XCFramework:"
            echo "$OPENSSL_FRAMEWORK"

            find "$GITHUB_WORKSPACE/OpenSSL" \
              -maxdepth 5 \
              -print \
              2>/dev/null \
              | head -300 || true

            exit 1
          fi

          echo "OpenSSL XCFramework:"
          echo "$OPENSSL_FRAMEWORK"

          echo "OpenSSL revision:"
          git -C "$GITHUB_WORKSPACE/OpenSSL" rev-parse HEAD

          echo
          echo "Native dependencies OK."

      # =========================================================
      # XCODE 26.2
      # =========================================================
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2.0"

      # =========================================================
      # VERIFY XCODE
      #
      # IMPORTANT:
      # Do not pipe xcodebuild -version directly into grep -q.
      # =========================================================
      - name: Verify Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Xcode"
          echo "========================================"

          XCODE_VERSION="$(xcodebuild -version)"

          printf '%s\n' "$XCODE_VERSION"

          echo
          echo "Developer directory:"
          xcode-select -p

          echo
          echo "Swift:"
          swift --version

          echo
          echo "SDKs:"
          xcodebuild -showsdks

          EXPECTED_XCODE="Xcode 26.2"

          if [[ "$XCODE_VERSION" != *"$EXPECTED_XCODE"* ]]; then
            echo "::error::Expected Xcode 26.2."
            echo
            echo "Actual Xcode:"
            printf '%s\n' "$XCODE_VERSION"
            exit 1
          fi

          echo
          echo "Xcode 26.2 verified successfully."

      # =========================================================
      # CLEAN BUILD
      # =========================================================
      - name: Prepare clean build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build/StikJIT"

      # =========================================================
      # BUILD STIKJIT WITH XCODE 26.2
      # =========================================================
      - name: Build StikJIT with Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$GITHUB_WORKSPACE/Scripts/build_stikjit.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Missing StikJIT build script:"
            echo "$SCRIPT"
            exit 1
          fi

          chmod +x "$SCRIPT"

          echo "========================================"
          echo "Building StikJIT"
          echo "========================================"

          bash "$SCRIPT"

          echo
          echo "Searching for generated StikJIT..."

          FOUND="$(
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name 'StikJIT.xcframework' \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$FOUND" ]; then
            echo "::error::build_stikjit.sh did not produce StikJIT.xcframework."

            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 8 \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "Generated framework:"
          echo "$FOUND"

          TARGET="$GITHUB_WORKSPACE/build/StikJIT/StikJIT.xcframework"

          if [ "$FOUND" != "$TARGET" ]; then
            rm -rf "$TARGET"
            ditto "$FOUND" "$TARGET"
          fi

          if [ ! -f "$TARGET/Info.plist" ]; then
            echo "::error::Generated StikJIT XCFramework is invalid."
            echo "Expected:"
            echo "$TARGET/Info.plist"
            exit 1
          fi

          echo "StikJIT XCFramework verified."

      # =========================================================
      # REMOVE TEMPORARY STIKJIT SOURCE TREE
      # =========================================================
      - name: Remove temporary StikJIT source tree
        shell: bash
        run: |
          set -euo pipefail

          STIKJIT="$GITHUB_WORKSPACE/build/StikJIT/StikJIT.xcframework"

          if [ ! -f "$STIKJIT/Info.plist" ]; then
            echo "::error::StikJIT XCFramework is missing."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build/StikJITSource"

          if [ -d "$GITHUB_WORKSPACE/build/StikJITSource" ]; then
            echo "::error::StikJITSource still exists."
            exit 1
          fi

          echo "Temporary StikJIT source removed."

      # =========================================================
      # INSPECT / NORMALIZE STIKJIT INTERFACES
      # =========================================================
      - name: Inspect StikJIT Swift interfaces
        shell: bash
        run: |
          set -euo pipefail

          XC="$GITHUB_WORKSPACE/build/StikJIT/StikJIT.xcframework"

          echo "========================================"
          echo "Inspecting StikJIT Swift interfaces"
          echo "========================================"

          INTERFACES="$(
            find "$XC" \
              -type f \
              -name '*.swiftinterface' \
              -print \
              2>/dev/null || true
          )"

          if [ -z "$INTERFACES" ]; then
            echo "No textual Swift interfaces found."
            exit 0
          fi

          printf '%s\n' "$INTERFACES"

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue

            echo
            echo "Checking:"
            echo "$FILE"

            if grep -nE \
              'StikJIT\.(DDIPaths|DeveloperDiskImageService|StikJIT)' \
              "$FILE" \
              >/dev/null 2>&1; then

              echo "Normalizing problematic StikJIT references."

              cp "$FILE" "$FILE.before-normalization"

              sed -i '' \
                -e 's/StikJIT\.DDIPaths/DDIPaths/g' \
                -e 's/StikJIT\.DeveloperDiskImageService/DeveloperDiskImageService/g' \
                -e 's/StikJIT\.StikJIT/StikJIT/g' \
                "$FILE"
            fi

          done <<< "$INTERFACES"

      # =========================================================
      # VALIDATE STIKJIT MODULE
      # =========================================================
      - name: Validate StikJIT module
        shell: bash
        run: |
          set -euo pipefail

          XC="$GITHUB_WORKSPACE/build/StikJIT/StikJIT.xcframework"

          echo "========================================"
          echo "Validating StikJIT"
          echo "========================================"

          test -d "$XC"
          test -f "$XC/Info.plist"

          echo
          echo "Module directories:"

          find "$XC" \
            -type d \
            -path '*/Modules/StikJIT.swiftmodule' \
            -print \
            || true

          echo
          echo "Checking problematic interface references..."

          if grep -R \
            -nE \
            'StikJIT\.(DDIPaths|DeveloperDiskImageService|StikJIT)' \
            "$XC" \
            --include='*.swiftinterface' \
            >/dev/null 2>&1; then

            echo "::error::Invalid StikJIT-qualified references remain."

            grep -R \
              -nE \
              'StikJIT\.(DDIPaths|DeveloperDiskImageService|StikJIT)' \
              "$XC" \
              --include='*.swiftinterface' \
              || true

            exit 1
          fi

          echo "StikJIT validation passed."

      # =========================================================
      # VALIDATE LOCALIZATION
      #
      # Xcode 26.2 can crash internally while processing a malformed
      # .strings file. Validate every Localizable.strings file before
      # xcodebuild reaches the localization phase.
      # =========================================================
      - name: Validate localization files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating localization files"
          echo "========================================"

          FOUND=0
          FAILED=0

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue

            FOUND=1

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$FILE"
            echo "----------------------------------------"

            # ---------------------------------------------------
            # UTF-8 validation
            # ---------------------------------------------------
            if ! iconv -f UTF-8 -t UTF-8 "$FILE" >/dev/null 2>&1; then
              echo "::error file=$FILE::File is not valid UTF-8."
              FAILED=1
              continue
            fi

            # ---------------------------------------------------
            # Normalize CRLF/CR line endings.
            #
            # Xcode's localization parser is sensitive to malformed
            # line endings in some projects.
            # ---------------------------------------------------
            TMP="${FILE}.normalized"

            if ! sed 's/\r$//' "$FILE" > "$TMP"; then
              echo "::error file=$FILE::Unable to normalize line endings."
              rm -f "$TMP"
              FAILED=1
              continue
            fi

            if ! cmp -s "$FILE" "$TMP"; then
              echo "Normalizing line endings:"
              echo "$FILE"
              mv "$TMP" "$FILE"
            else
              rm -f "$TMP"
            fi

            # ---------------------------------------------------
            # Property-list / .strings syntax validation
            # ---------------------------------------------------
            if ! plutil -lint "$FILE"; then
              echo "::error file=$FILE::Invalid .strings syntax."
              FAILED=1
              continue
            fi

            echo "Valid UTF-8."
            echo "Valid line endings."
            echo "Valid .strings syntax."

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -path '*/ar.lproj/Localizable.strings' \
                -o \
                -path '*/[a-zA-Z_-]*.lproj/Localizable.strings' \
              \) \
              -print
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No Localizable.strings files found."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "::error::One or more localization files failed validation."
            echo "Xcode 26.2 localization processing was stopped before compilation."
            exit 1
          fi

          echo
          echo "All localization files passed validation."

      # =========================================================
      # OPTIONAL LOCALIZATION INVENTORY
      # =========================================================
      - name: Show localization inventory
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Localization inventory"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -path '*/Localizable.strings' \
            -print \
            | sort \
            || true

      # =========================================================
      # SWIFT PACKAGES
      # =========================================================
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME"

      # =========================================================
      # BUILD SETTINGS
      # =========================================================
      - name: Inspect build settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -showBuildSettings \
            > "$GITHUB_WORKSPACE/build/build-settings.txt"

          grep -E \
            'PRODUCT_NAME|FULL_PRODUCT_NAME|TARGET_BUILD_DIR|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER|SWIFT_VERSION|SWIFT_ENABLE_EXPLICIT_MODULES|BUILD_LIBRARY_FOR_DISTRIBUTION' \
            "$GITHUB_WORKSPACE/build/build-settings.txt" \
            || true

      # =========================================================
      # BUILD UNSIGNED DELVEK
      # =========================================================
      - name: Build unsigned DELvEK
        shell: bash
        run: |
          set -o pipefail

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"
          LOG="$GITHUB_WORKSPACE/build/xcodebuild.log"

          rm -rf "$DERIVED_DATA"
          mkdir -p "$DERIVED_DATA"

          xcodebuild build \
            -project "$GITHUB_WORKSPACE/$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG"

      # =========================================================
      # DIAGNOSTICS
      # =========================================================
      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostics
          path: |
            build/xcodebuild.log
            build/build-settings.txt
            build/StikJIT
          if-no-files-found: warn

      # =========================================================
      # LOCATE APP
      # =========================================================
      - name: Locate DELvEK.app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"

          if [ ! -d "$PRODUCTS" ]; then
            echo "::error::Build Products directory does not exist:"
            echo "$PRODUCTS"
            exit 1
          fi

          APP="$(
            find "$PRODUCTS" \
              -type d \
              -name 'DELvEK.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::DELvEK.app was not produced."

            find "$PRODUCTS" \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          printf '%s\n' "$APP" \
            > "$GITHUB_WORKSPACE/build/app-path.txt"

          echo "DELvEK.app:"
          echo "$APP"

      # =========================================================
      # REMOVE NESTED SIGNATURES
      #
      # Xcode may copy pre-signed third-party frameworks into the
      # unsigned application even with CODE_SIGNING_ALLOWED=NO.
      #
      # Remove those signatures so the unsigned artifact is actually
      # unsigned and can be signed cleanly later.
      # =========================================================
      - name: Strip nested code signatures
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat "$GITHUB_WORKSPACE/build/app-path.txt")"

          echo "========================================"
          echo "Removing nested code signatures"
          echo "========================================"

          echo "Application:"
          echo "$APP"

          SIGNATURES_BEFORE="$(
            find "$APP" \
              -type d \
              -name '_CodeSignature' \
              -print
          )"

          if [ -n "$SIGNATURES_BEFORE" ]; then
            echo "Found embedded signatures:"
            echo "$SIGNATURES_BEFORE"

            while IFS= read -r SIGNATURE; do
              [ -n "$SIGNATURE" ] || continue

              echo "Removing:"
              echo "$SIGNATURE"

              rm -rf "$SIGNATURE"
            done <<< "$SIGNATURES_BEFORE"
          else
            echo "No nested _CodeSignature directories found."
          fi

          PROFILES="$(
            find "$APP" \
              -type f \
              -name 'embedded.mobileprovision' \
              -print
          )"

          if [ -n "$PROFILES" ]; then
            echo "Found embedded provisioning profiles:"
            echo "$PROFILES"

            while IFS= read -r PROFILE; do
              [ -n "$PROFILE" ] || continue

              echo "Removing:"
              echo "$PROFILE"

              rm -f "$PROFILE"
            done <<< "$PROFILES"
          else
            echo "No nested provisioning profiles found."
          fi

          echo
          echo "Remaining signature directories:"

          find "$APP" \
            -type d \
            -name '_CodeSignature' \
            -print \
            || true

          echo
          echo "Remaining provisioning profiles:"

          find "$APP" \
            -type f \
            -name 'embedded.mobileprovision' \
            -print \
            || true

      # =========================================================
      # PACKAGE IPA
      # =========================================================
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat "$GITHUB_WORKSPACE/build/app-path.txt")"

          PAYLOAD="$GITHUB_WORKSPACE/build/Payload"
          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"

          rm -rf "$PAYLOAD"
          rm -rf "$GITHUB_WORKSPACE/build/verify"
          rm -f "$IPA"

          mkdir -p "$PAYLOAD"

          ditto \
            "$APP" \
            "$PAYLOAD/DELvEK.app"

          cd "$GITHUB_WORKSPACE/build"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          rm -rf "$PAYLOAD"

          echo "Created unsigned IPA:"
          ls -lh "$IPA"

      # =========================================================
      # VERIFY IPA
      # =========================================================
      - name: Verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa"
          VERIFY="$GITHUB_WORKSPACE/build/verify"
          APP="$VERIFY/Payload/DELvEK.app"

          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          /usr/bin/unzip \
            -q \
            "$IPA" \
            -d "$VERIFY"

          if [ ! -d "$APP" ]; then
            echo "::error::Packaged DELvEK.app was not found."
            exit 1
          fi

          echo "========================================"
          echo "Bundle information"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$APP/Info.plist" \
            || true

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP/Info.plist" \
            || true

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP/Info.plist" \
            || true

          echo
          echo "========================================"
          echo "Signature directories"
          echo "========================================"

          SIGNATURE_DIRS="$(
            find "$APP" \
              -type d \
              -name '_CodeSignature' \
              -print
          )"

          if [ -n "$SIGNATURE_DIRS" ]; then
            echo "::error::Unsigned artifact contains _CodeSignature:"
            echo "$SIGNATURE_DIRS"
            exit 1
          fi

          PROVISIONING_PROFILES="$(
            find "$APP" \
              -type f \
              -name 'embedded.mobileprovision' \
              -print
          )"

          if [ -n "$PROVISIONING_PROFILES" ]; then
            echo "::error::Unsigned artifact contains embedded.mobileprovision:"
            echo "$PROVISIONING_PROFILES"
            exit 1
          fi

          echo "No _CodeSignature directories found."
          echo "No embedded.mobileprovision found."

          echo
          echo "codesign inspection:"
          codesign -dvv "$APP" 2>&1 || true

          echo
          echo "========================================"
          echo "IPA contents"
          echo "========================================"

          /usr/bin/unzip \
            -l \
            "$IPA" \
            | head -100

      # =========================================================
      # CHECKSUM
      # =========================================================
      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail

          shasum \
            -a 256 \
            "$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa" \
            | tee \
              "$GITHUB_WORKSPACE/build/DELvEK-unsigned.ipa.sha256"

      # =========================================================
      # ARTIFACT
      # =========================================================
      - name: Upload unsigned DELvEK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELvEK-unsigned
          path: |
            build/DELvEK-unsigned.ipa
            build/DELvEK-unsigned.ipa.sha256
          if-no-files-found: error
